<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Priyanka 🎂</title>

<style>
/* Base */
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Segoe UI', sans-serif;
    text-align:center;
    overflow:hidden;
}

/* Background video */
.bg-video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-3;
}

/* Soft dark overlay */
.video-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.4);
    z-index:-2;
}

/* Glass box with slow parallax zoom */
.box{
    position:relative;
    padding:30px;
    width:340px;
    border-radius:18px;

    background:
      linear-gradient(
        rgba(255,255,255,0.4),
        rgba(255,255,255,0.4)
      ),
      url("card-bg.jpg");
    background-size:110%;
    background-position:center;

    backdrop-filter: blur(12px) saturate(120%);
    -webkit-backdrop-filter: blur(12px) saturate(120%);

    border:1px solid rgba(255,255,255,0.35);
    box-shadow:0 25px 55px rgba(0,0,0,0.45);

    animation:slowZoom 18s ease-in-out infinite alternate;
    z-index:1;
}

/* Heartbeat title */
h1{
    color:#ff3b6f;
    animation:heartbeat 2s ease-in-out infinite;
}

@keyframes heartbeat{
    0%,100%{transform:scale(1);}
    14%{transform:scale(1.08);}
    28%{transform:scale(1);}
    42%{transform:scale(1.08);}
    70%{transform:scale(1);}
}

/* Parallax zoom */
@keyframes slowZoom{
    from{background-size:110%;}
    to{background-size:125%;}
}

#locked,#secret{
    display:none;
    font-size:16px;
    color:#222;
    line-height:1.6;
}

.countdown{
    font-weight:bold;
    color:#ff3b6f;
}

audio{
    margin-top:10px;
    width:100%;
}

.fade-end{
    margin-top:18px;
    font-size:14px;
    color:#555;
    opacity:0;
    animation:fadeEnd 4s ease forwards;
    animation-delay:6s;
}

@keyframes fadeEnd{
    to{opacity:1;}
}

/* Floating hearts */
.heart{
    position:absolute;
    bottom:-20px;
    font-size:18px;
    animation:float 8s linear infinite;
    opacity:0.7;
}

@keyframes float{
    from{transform:translateY(0);}
    to{transform:translateY(-110vh);}
}
</style>
</head>

<body>

<!-- Background Video -->
<video class="bg-video" autoplay muted loop playsinline>
  <source src="VID_20251218_101551_080 (1).mp4" type="video/mp4">
</video>

<!-- Overlay -->
<div class="video-overlay"></div>

<!-- Content -->
<div class="box">
    <h1>Happy Birthday Priyanka 🎉</h1>

    <div id="locked">
        ⏳  
        Ek chhota sa surprise  
        <br>12:00 AM par unlock hoga  
        <br><br>
        <span class="countdown" id="timer"></span>
    </div>

    <div id="secret">
        💖  
        Priyanka,<br>
        tum meri life ka wo hissa ho  
        jo bina bole hi sab kuch samajh leta hai.  
        <br><br>
        Tum mere liye sirf aaj nahi,  
        har din special ho. 🎂✨  

        <br><br>
        🎧 Ek baat sunni hai?
        <br>
        <audio controls>
            <source src="voice.mp3" type="audio/mpeg">
        </audio>

        <div class="fade-end">
            Kuch pal… sirf tumhare liye 💫
        </div>
    </div>
</div>

<script>
const now=new Date();
const unlockTime=new Date();
unlockTime.setHours(24,0,0,0);

/* TEST MODE */
if(false){
    document.getElementById("locked").style.display="block";
    setInterval(updateTimer,1000);
}else{
    unlock();
}

function updateTimer(){
    const diff=unlockTime-new Date();
    if(diff<=0){unlock();return;}
    const h=Math.floor(diff/1000/60/60);
    const m=Math.floor(diff/1000/60)%60;
    const s=Math.floor(diff/1000)%60;
    document.getElementById("timer").innerText=`${h}h ${m}m ${s}s`;
}

function unlock(){
    document.getElementById("locked").style.display="none";
    document.getElementById("secret").style.display="block";
    launchHearts();
}

function launchHearts(){
    for(let i=0;i<15;i++){
        const h=document.createElement("div");
        h.className="heart";
        h.innerText="💖";
        h.style.left=Math.random()*100+"vw";
        h.style.animationDuration=(6+Math.random()*4)+"s";
        document.body.appendChild(h);
    }
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Priyanka 🎂</title>

<style>
*{box-sizing:border-box}

/* BASE */
body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
    text-align:center;
    overflow:hidden;
    color:#222;
}

/* BACKGROUND VIDEO */
.bg-video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-3;
    animation:videoDrift 30s linear infinite alternate;
}

/* CINEMATIC OVERLAY */
.video-overlay{
    position:fixed;
    inset:0;
    background:
      radial-gradient(120% 120% at 50% 20%, rgba(255,255,255,0.08), rgba(0,0,0,0.45)),
      linear-gradient(180deg, rgba(0,0,0,0.2), rgba(0,0,0,0.6));
    z-index:-2;
}

/* GLASS CARD */
.card{
    position:relative;
    width:360px;
    max-width:92vw;
    padding:28px 26px;
    border-radius:22px;
    background:
      linear-gradient(rgba(255,255,255,.45), rgba(255,255,255,.45)),
      url("card-bg.jpg");
    background-size:120%;
    background-position:center;
    backdrop-filter: blur(14px) saturate(120%);
    -webkit-backdrop-filter: blur(14px) saturate(120%);
    border:1px solid rgba(255,255,255,.35);
    box-shadow:0 30px 70px rgba(0,0,0,.45);
    animation:slowZoom 22s ease-in-out infinite alternate;
}

/* SOFT GLOW EDGE */
.card::before{
    content:"";
    position:absolute;
    inset:-1px;
    border-radius:inherit;
    background:linear-gradient(135deg, rgba(255,105,180,.35), rgba(255,255,255,.15), rgba(255,105,180,.25));
    filter:blur(6px);
    z-index:-1;
}

/* TITLE HEARTBEAT */
h1{
    margin:0 0 8px;
    font-size:1.6rem;
    color:#ff3b6f;
    animation:heartbeat 2.2s ease-in-out infinite;
}

.sub{
    font-size:.95rem;
    opacity:.85;
}

/* CONTENT */
#locked,#secret{display:none}

.message{
    margin-top:10px;
    font-size:1rem;
    line-height:1.6;
}

audio{
    width:100%;
    margin-top:10px;
}

/* LISTEN PULSE */
.listen{
    display:inline-block;
    margin-top:8px;
    padding:6px 14px;
    border-radius:999px;
    background:rgba(255,59,111,.12);
    color:#ff3b6f;
    font-weight:600;
    animation:pulse 2.6s ease-in-out infinite;
}

/* MEMORY SPARK LINE */
.spark{
    margin-top:10px;
    font-size:.85rem;
    color:#444;
    opacity:0;
    animation:sparkFade 3s ease forwards;
    animation-delay:7s;
}

/* END LINE */
.fade-end{
    margin-top:12px;
    font-size:.85rem;
    color:#555;
    opacity:0;
    animation:fadeEnd 4s ease forwards;
    animation-delay:10s;
}

/* HEARTS */
.heart{
    position:absolute;
    bottom:-24px;
    font-size:18px;
    opacity:.75;
    animation:float 8s linear infinite;
}

/* TOUCH RIPPLE */
.ripple{
    position:fixed;
    border-radius:50%;
    transform:scale(0);
    background:rgba(255,255,255,0.4);
    animation:ripple 600ms linear;
    pointer-events:none;
}

/* ANIMATIONS */
@keyframes heartbeat{
    0%,100%{transform:scale(1)}
    14%{transform:scale(1.08)}
    28%{transform:scale(1)}
    42%{transform:scale(1.08)}
}
@keyframes slowZoom{
    from{background-size:120%}
    to{background-size:135%}
}
@keyframes pulse{
    0%,100%{box-shadow:0 0 0 0 rgba(255,59,111,.35)}
    50%{box-shadow:0 0 0 12px rgba(255,59,111,0)}
}
@keyframes fadeEnd{to{opacity:1}}
@keyframes sparkFade{to{opacity:1}}
@keyframes float{to{transform:translateY(-120vh)}}
@keyframes ripple{to{transform:scale(4);opacity:0}}
@keyframes videoDrift{
    from{transform:scale(1) translateX(0)}
    to{transform:scale(1.05) translateX(-20px)}
}
</style>
</head>

<body>

<!-- VIDEO -->
<video class="bg-video" autoplay muted loop playsinline>
  <source src="VID_20251218_101551_080 (1).mp4" type="video/mp4">
</video>
<div class="video-overlay"></div>

<!-- CARD -->
<div class="card">
    <h1>Happy Birthday Priyanka 🎉</h1>
    <div class="sub">Just something… made with heart</div>

    <div id="locked">
        ⏳ Ek chhota sa surprise
        <div id="timer"></div>
    </div>

    <div id="secret">
        <div class="message">
            💖 Priyanka,<br>
            tum meri life ka wo hissa ho<br>
            jo bina bole hi sab kuch samajh leta hai.<br><br>
            Tum mere liye sirf aaj nahi,<br>
            har din special ho. 🎂✨
        </div>

        <div class="listen">🎧 Suno…</div>
        <audio id="voice" controls>
            <source src="voice.mp3" type="audio/mpeg">
        </audio>

        <div class="spark">Some moments don’t need words…</div>
        <div class="fade-end">Kuch pal… sirf tumhare liye 💫</div>
    </div>
</div>

<script>
/* UNLOCK LOGIC */
const unlockTime=new Date();unlockTime.setHours(24,0,0,0);

/* TEST MODE */
if(false){
    document.getElementById("locked").style.display="block";
}else{
    unlock();
}

function unlock(){
    document.getElementById("secret").style.display="block";
    launchHearts();
    autoPlayVoice();
}

/* AUTO PLAY VOICE (SAFE) */
function autoPlayVoice(){
    const a=document.getElementById("voice");
    a.play().catch(()=>{});
}

/* HEARTS */
function launchHearts(){
    for(let i=0;i<20;i++){
        const h=document.createElement("div");
        h.className="heart";
        h.innerText=Math.random()>0.5?"💖":"🤍";
        h.style.left=Math.random()*100+"vw";
        h.style.animationDuration=(6+Math.random()*5)+"s";
        document.body.appendChild(h);
    }
}

/* TOUCH RIPPLE */
document.addEventListener("click",e=>{
    const r=document.createElement("span");
    r.className="ripple";
    r.style.left=e.clientX+"px";
    r.style.top=e.clientY+"px";
    r.style.width=r.style.height="120px";
    document.body.appendChild(r);
    setTimeout(()=>r.remove(),600);
});

/* EXIT LINE */
window.addEventListener("beforeunload",()=>{
    return "Come back anytime 💗";
});
</script>

</body>
</html>

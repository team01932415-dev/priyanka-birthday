<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Priyanka 🎂</title>

<style>
/* =========================
   BASE
========================= */
*{box-sizing:border-box}
body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
    text-align:center;
    overflow:hidden;
    color:#222;
}

/* =========================
   BACKGROUND VIDEO + CINEMATIC OVERLAY
========================= */
.bg-video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-3;
}
.video-overlay{
    position:fixed;
    inset:0;
    background:
      radial-gradient(120% 120% at 50% 20%, rgba(255,255,255,0.08), rgba(0,0,0,0.35)),
      linear-gradient(180deg, rgba(0,0,0,0.15), rgba(0,0,0,0.55));
    z-index:-2;
}

/* subtle film grain */
.video-overlay::after{
    content:"";
    position:absolute;
    inset:0;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='.05'/></svg>");
    opacity:.25;
}

/* =========================
   GLASS CARD (WITH IMAGE + SLOW PARALLAX)
========================= */
.card{
    position:relative;
    width:360px;
    max-width:92vw;
    padding:28px 26px 26px;
    border-radius:22px;

    background:
      linear-gradient(rgba(255,255,255,.45), rgba(255,255,255,.45)),
      url("card-bg.jpg");
    background-size:115%;
    background-position:center;

    backdrop-filter: blur(14px) saturate(120%);
    -webkit-backdrop-filter: blur(14px) saturate(120%);

    border:1px solid rgba(255,255,255,.35);
    box-shadow:0 30px 70px rgba(0,0,0,.45);
    animation:slowZoom 22s ease-in-out infinite alternate;
}

/* gentle glow edge */
.card::before{
    content:"";
    position:absolute;
    inset:-1px;
    border-radius:inherit;
    background:linear-gradient(135deg, rgba(255,105,180,.35), rgba(255,255,255,.15), rgba(255,105,180,.25));
    z-index:-1;
    filter:blur(6px);
}

/* =========================
   TITLES & MICRO-ANIMS
========================= */
h1{
    margin:0 0 8px;
    font-size:1.6rem;
    color:#ff3b6f;
    animation:heartbeat 2.2s ease-in-out infinite;
}
.sub{
    font-size:.95rem;
    color:#333;
    opacity:.85;
}

/* =========================
   CONTENT
========================= */
#locked,#secret{display:none}
.countdown{
    margin-top:8px;
    font-weight:600;
    color:#ff3b6f;
}

.message{
    margin-top:10px;
    font-size:1rem;
    line-height:1.6;
}

audio{
    width:100%;
    margin-top:10px;
}

/* CTA pulse */
.listen{
    display:inline-block;
    margin-top:8px;
    padding:6px 12px;
    border-radius:999px;
    background:rgba(255,59,111,.12);
    color:#ff3b6f;
    font-weight:600;
    animation:pulse 2.6s ease-in-out infinite;
}

/* =========================
   END LINE
========================= */
.fade-end{
    margin-top:14px;
    font-size:.85rem;
    color:#555;
    opacity:0;
    animation:fadeEnd 4s ease forwards;
    animation-delay:6s;
}

/* =========================
   FLOATING HEARTS
========================= */
.heart{
    position:absolute;
    bottom:-24px;
    font-size:18px;
    opacity:.75;
    animation:float 8s linear infinite;
    filter:drop-shadow(0 6px 12px rgba(0,0,0,.35));
}

/* =========================
   KEYFRAMES
========================= */
@keyframes heartbeat{
    0%,100%{transform:scale(1)}
    14%{transform:scale(1.08)}
    28%{transform:scale(1)}
    42%{transform:scale(1.08)}
    70%{transform:scale(1)}
}
@keyframes slowZoom{
    from{background-size:115%}
    to{background-size:130%}
}
@keyframes pulse{
    0%,100%{box-shadow:0 0 0 0 rgba(255,59,111,.35)}
    50%{box-shadow:0 0 0 10px rgba(255,59,111,0)}
}
@keyframes fadeEnd{
    to{opacity:1}
}
@keyframes float{
    from{transform:translateY(0)}
    to{transform:translateY(-120vh)}
}

/* =========================
   MOBILE POLISH
========================= */
@media (max-width:420px){
    .card{padding:24px}
    h1{font-size:1.45rem}
}
</style>
</head>

<body>

<!-- BACKGROUND VIDEO -->
<video class="bg-video" autoplay muted loop playsinline>
  <source src="VID_20251218_101551_080 (1).mp4" type="video/mp4">
</video>
<div class="video-overlay"></div>

<!-- GLASS CARD -->
<div class="card">
    <h1>Happy Birthday Priyanka 🎉</h1>
    <div class="sub">A little something, just for you</div>

    <div id="locked">
        ⏳ Ek chhota sa surprise  
        <div class="countdown" id="timer"></div>
    </div>

    <div id="secret">
        <div class="message">
            💖 Priyanka,<br>
            tum meri life ka wo hissa ho<br>
            jo bina bole hi sab kuch samajh leta hai.<br><br>
            Tum mere liye sirf aaj nahi,<br>
            har din special ho. 🎂✨
        </div>

        <div class="listen">🎧 Suno…</div>
        <audio controls>
            <source src="voice.mp3" type="audio/mpeg">
        </audio>

        <div class="fade-end">Kuch pal… sirf tumhare liye 💫</div>
    </div>
</div>

<script>
/* =========================
   TIMER / UNLOCK
========================= */
const now = new Date();
const unlockTime = new Date();
unlockTime.setHours(24,0,0,0);

/* FINAL MODE:
   - TEST: if(false)
   - LIVE: if(now < unlockTime)
*/
if(false){
    document.getElementById("locked").style.display="block";
    setInterval(updateTimer,1000);
}else{
    unlock();
}

function updateTimer(){
    const diff = unlockTime - new Date();
    if(diff <= 0){ unlock(); return; }
    const h = Math.floor(diff/1000/60/60);
    const m = Math.floor(diff/1000/60)%60;
    const s = Math.floor(diff/1000)%60;
    document.getElementById("timer").innerText = `${h}h ${m}m ${s}s`;
}

function unlock(){
    const l = document.getElementById("locked");
    const s = document.getElementById("secret");
    if(l) l.style.display="none";
    if(s) s.style.display="block";
    launchHearts();
}

/* =========================
   HEARTS
========================= */
function launchHearts(){
    for(let i=0;i<18;i++){
        const h = document.createElement("div");
        h.className="heart";
        h.innerText = Math.random()>0.5 ? "💖" : "🤍";
        h.style.left = Math.random()*100+"vw";
        h.style.animationDuration = (6+Math.random()*5)+"s";
        document.body.appendChild(h);
    }
}
</script>

</body>
</html>

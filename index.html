<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Priyanka 🎂</title>

<style>
*{box-sizing:border-box}

/* BASE */
body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
    text-align:center;
    overflow:hidden;
    color:#222;
}

/* BACKGROUND VIDEO */
.bg-video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-3;
    animation:videoDrift 30s linear infinite alternate;
}

/* OVERLAY */
.video-overlay{
    position:fixed;
    inset:0;
    background:
      radial-gradient(120% 120% at 50% 20%, rgba(255,255,255,0.08), rgba(0,0,0,0.45)),
      linear-gradient(180deg, rgba(0,0,0,0.2), rgba(0,0,0,0.6));
    z-index:-2;
}

/* CARD */
.card{
    position:relative;
    width:360px;
    max-width:92vw;
    padding:28px 26px;
    border-radius:22px;
    background:
      linear-gradient(rgba(255,255,255,.45), rgba(255,255,255,.45)),
      url("card-bg.jpg");
    background-size:120%;
    background-position:center;
    backdrop-filter: blur(14px) saturate(120%);
    border:1px solid rgba(255,255,255,.35);
    box-shadow:0 30px 70px rgba(0,0,0,.45);
}

/* TEXT */
h1{
    margin:0 0 8px;
    font-size:1.6rem;
    color:#ff3b6f;
}

.sub{
    font-size:.95rem;
    opacity:.85;
}

.message{
    margin-top:10px;
    font-size:1rem;
    line-height:1.6;
}

audio{
    width:100%;
    margin-top:10px;
}

.listen{
    margin-top:8px;
    display:inline-block;
    padding:6px 14px;
    border-radius:999px;
    background:rgba(255,59,111,.12);
    color:#ff3b6f;
    font-weight:600;
}

.fade-end{
    margin-top:12px;
    font-size:.85rem;
    color:#555;
    opacity:0;
    animation:fadeEnd 4s ease forwards;
    animation-delay:8s;
}

/* HEARTS */
.heart{
    position:absolute;
    bottom:-24px;
    font-size:18px;
    opacity:.75;
    animation:float 8s linear infinite;
}

/* ANIMATIONS */
@keyframes float{
    to{transform:translateY(-120vh)}
}
@keyframes fadeEnd{
    to{opacity:1}
}
@keyframes videoDrift{
    from{transform:scale(1)}
    to{transform:scale(1.05)}
}
</style>
</head>

<body>

<!-- BACKGROUND VIDEO -->
<video class="bg-video" autoplay muted loop playsinline>
  <source src="VID_20251218_101551_080 (1).mp4" type="video/mp4">
</video>
<div class="video-overlay"></div>

<!-- CARD -->
<div class="card">
    <h1>Happy Birthday Priyanka 🎉</h1>
    <div class="sub">Just something… made with heart</div>

    <div class="message">
        💖 Priyanka,<br>
        tum meri life ka wo hissa ho<br>
        jo bina bole hi sab kuch samajh leta hai.<br><br>
        Tum mere liye sirf aaj nahi,<br>
        har din special ho. 🎂✨
    </div>

    <div class="listen">🎧 Suno…</div>

    <!-- VOICE -->
    <audio id="voice" controls>
        <source src="voice.mp3" type="audio/mpeg">
    </audio>

    <!-- BACKGROUND MUSIC -->
    <audio id="bgMusic" loop playsinline preload="auto">
        <source src="background.mp3" type="audio/mpeg">
    </audio>

    <div class="fade-end">Kuch pal… sirf tumhare liye 💫</div>
</div>

<script>
/* DIRECT OPEN */
launchHearts();
bindAudio();

/* BACKGROUND MUSIC + VOICE (AUTOPLAY SAFE) */
function bindAudio(){
    const voice = document.getElementById("voice");
    const bg = document.getElementById("bgMusic");

    bg.volume = 0.18;   // soft romantic
    voice.volume = 1.0;

    // start background music when voice starts
    voice.addEventListener("play",()=>{
        bg.play().catch(()=>{});
    });

    // fade out music when voice ends
    voice.addEventListener("ended",()=>{
        let fade = setInterval(()=>{
            if(bg.volume > 0.02){
                bg.volume -= 0.02;
            }else{
                bg.pause();
                clearInterval(fade);
            }
        },200);
    });
}

/* HEARTS */
function launchHearts(){
    for(let i=0;i<20;i++){
        const h=document.createElement("div");
        h.className="heart";
        h.innerText=Math.random()>0.5?"💖":"🤍";
        h.style.left=Math.random()*100+"vw";
        h.style.animationDuration=(6+Math.random()*5)+"s";
        document.body.appendChild(h);
    }
}
</script>

</body>
</html>
